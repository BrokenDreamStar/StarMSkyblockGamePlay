# StarMSkyblockGamePlay 消息配置
# 使用 & 加颜色代码 (&a=绿色, &c=红色, &e=黄色, &7=灰色, &b=天蓝色)
# 占位符格式: {placeholder_name}

trial-spawner:
  not-in-cooldown: "&c该试炼刷怪笼不在冷却中"
  cooldown-ended: "&a消耗 1 个铜块，试炼刷怪笼已刷新！"
  cooldown-reduced: "&a消耗 1 个铜块，冷却缩减 &e{reduction_seconds} &a秒！剩余冷却 &e{remaining_seconds} &a秒"

vault:
  not-in-blacklist: "&c该{vault_type}无法刷新"
  limit-reached: "&c你今天已刷新{vault_type} {count}/{limit} 次"
  removed: "&a消耗 1 个铜块，已刷新{vault_type}"

vault-types:
  normal: "宝库"
  ominous: "不祥宝库"

logger:
  vault-data-create-error: "无法创建 vault-data.yml: {error}"
  vault-data-save-error: "无法保存 vault-data.yml: {error}"
  vault-daily-reset: "{vault_name} 每日次数已重置"

snowball-converter:
  converted: "&a捕捉{entity}成功 已获得{entity}刷怪蛋x1"
  failed: "&7捕捉{entity}失败了..."
  no-egg: "&c该生物没有对应的刷怪蛋"
  give-snowball: "&a已给予 {player} {amount} 个{item-name}"

end-portal-generator:
  # 传送门已生成
  generated: "&a已生成末地传送门！"
  # 传送门生成失败（方块被阻挡）
  blocked: "&c传送门框架位置被阻挡，无法生成传送门！"
