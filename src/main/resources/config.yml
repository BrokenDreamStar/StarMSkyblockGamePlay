# StarMSkyblockGamePlay 配置

# 试炼刷怪笼功能（右键试炼刷怪笼使用铜块减少冷却时间）
trial-spawner:
  # 每个铜块减少的冷却时间（单位：tick）
  cooldown-reduction-ticks: 3600
  # 是否启用该功能
  enabled: true
  # 禁止使用刷怪蛋替换试炼刷怪笼
  prevent-ominous-spawn-egg: true

# 宝库功能（右键宝库消耗 1 个铜块，将玩家从奖励黑名单移除）
vault:
  # 是否启用宝库功能
  enabled: true
  # 每个玩家每天可以刷新宝库的次数（0 表示不限次数）
  blacklist-removal-limit: 5
  # 每日刷新时间（24小时制，HH:mm 格式）
  reset-time: '04:00'

# 不祥宝库功能（右键不祥宝库消耗 1 个铜块，将玩家从奖励黑名单移除）
ominous-vault:
  # 是否启用不祥宝库功能
  enabled: true
  # 每个玩家每天可以刷新不祥宝库的次数（0 表示不限次数）
  blacklist-removal-limit: 5
  # 每日刷新时间（24小时制，HH:mm 格式）
  reset-time: '04:00'

# 精准采集可采集方块列表（配置的方块在拥有精准采集附魔时会被完整采集，保留所有 NBT 数据）
silk-touch-collectibles:
  # 是否启用该功能
  enabled: true
  # 可采集的方块类型列表（填写 Material 枚举名）
  blocks:
    - SPAWNER
    - TRIAL_SPAWNER
    - VAULT
    - BUDDING_AMETHYST

# 雪球转换功能（击中生物有概率转换为对应刷怪蛋）
snowball-converter:
  # 是否启用该功能
  enabled: true
  # 全局转换概率（百分比 0-100）
  global-chance: 75
  # 雪球物品显示名称（支持 & 颜色代码，留空则不设置名称）
  item-name: "&d&l精灵球"
  # 雪球物品 Lore 描述（支持 & 颜色代码，每行一个）
  lore:
    - "&d击中生物时有概率将其捕捉为刷怪蛋"
    - "&e请在菜单的帮助页面查看可捕捉生物列表"
  # 未命中生物或命中无法捕捉的生物时，是否返还精灵球
  refund-on-miss: true
  # 是否启用白名单模式（true=仅白名单内生物可转换，false=黑名单模式）
  use-whitelist: true
  # 白名单生物类型列表（use-whitelist: true 时生效，EntityType 枚举名）
  whitelist:
    - ALLAY #悦灵
