# 闪电转化功能（闪电命中守卫者时将其转化为远古守卫者）
lightning-converter:
  # 是否启用该功能
  enabled: true

# 末地传送门生成器（使用带有特殊 NBT 的末影之眼右键点击方块生成末地传送门）
end-portal-generator:
  # 是否启用该功能
  enabled: true
  # 物品显示名称（支持 & 颜色代码，留空则不设置）
  item-name: "&5&l传送门生成器"
  # 物品 Lore 描述（每行一条）
  lore:
    - "&7右键点击方块以生成末地传送门"

# 回响碎片强化尖啸体（右键幽匿尖啸体消耗 1 个回响碎片，使其可召唤监守者）
sculk-shrieker:
  # 是否启用该功能
  enabled: true

# 铁砧超等级附魔书（允许应用超过原版最高等级的附魔书，如效率10）
anvil-high-level-enchant:
  # 是否启用该功能
  enabled: true
  # 铁砧"过于昂贵"的经验花费上限（原版为 40；设为 0 或负数表示不设上限）
  max-repair-cost: 40

# 滴水石锥加速生长（通过事件索引维护钟乳石结构，定期触发随机刻，加速生长/炼药锅填充/泥巴变黏土）
dripstone-growth:
  # 是否启用该功能
  enabled: true
  # 每轮对每个符合条件的钟乳石尖触发的随机刻次数（范围 1-1000，原版每随机刻 1.138% 概率生长一格，期望 100 分钟/格）
  # 每个钟乳石尖每秒随机刻次数 = random-ticks-per-pass × 20 ÷ check-interval-ticks
  # 默认配置：10 × 20 ÷ 100 = 2 次/秒 → 约 44 秒/格（约原版 100 倍）
  random-ticks-per-pass: 10
  # 每隔多少游戏刻触发一轮随机刻（默认 100 tick = 5 秒）
  check-interval-ticks: 100
  # 全量纠偏扫描间隔（分钟；扫描已加载区块，补全未被放置事件捕获的钟乳石结构；0=关闭）
  rescan-interval-minutes: 10
  # 全量扫描每个游戏刻处理的区块数（仅影响启动补建/纠偏扫描的速度，过大可能造成短暂卡顿）
  scan-chunks-per-tick: 1
  # 生效的世界名称列表（留空=所有世界）
  worlds: []

# 刷怪笼刷怪蛋强化功能（对同一个普通刷怪笼反复使用刷怪蛋，每个蛋都提升一点刷怪效率）
# 只有与刷怪笼中已有生物匹配的刷怪蛋才会被消耗用于强化；其他刷怪蛋执行原版替换生物操作，
# 并把该刷怪笼的强化重置为原版（已喂蛋数归零、效率还原 1 倍）
# 强化进度存在刷怪笼方块 NBT 中：配合 silk-touch-collectibles 精准采集可将已强化的刷怪笼完整搬走（进度保留）
spawner-upgrade:
  # 是否启用该功能
  enabled: true
  # 达到最大效率所需的刷怪蛋总数（默认 30，达到后不再消耗刷怪蛋）
  max-eggs: 30
  # 喂满 max-eggs 个刷怪蛋时，刷怪 CD 缩短为原版的 1/max-multiplier（默认 5 = 缩短为 1/5）
  max-multiplier: 5
  # 统一的初始每次刷出数量（无论什么生物，初始都是这个数量）
  base-spawn-count: 3
  # 每放入多少个刷怪蛋，每次刷出的数量增加 1 只（默认 5，即每 5 个蛋 +1 只；0 表示不增加数量）
  eggs-per-extra-mob: 5
  # 刷怪笼附近同类生物上限的初始值（0 个蛋也生效；原版默认仅 6，怪物堆在笼旁会让整轮停止生成，
  # 抬高后可显著减少“越刷越少 / 整轮不刷”的情况）
  base-max-nearby-entities: 24

# 水中快速氧化（铜方块及其变种在水中时对其调用真实 randomTick() 加速氧化，
# 铜傀儡按随机刻抽取加速；本版本原版水/雨不再加速氧化，属插件额外加速）
copper-oxidation:
  # 是否启用该功能
  enabled: true
  # 生效的世界名称列表（留空=所有世界）
  worlds: []
  # 每多少游戏刻触发一轮（默认 500 tick = 25 秒）
  check-interval-ticks: 500
  # 每轮对每个水中可氧化铜方块调用 randomTick() 的次数（默认 1；
  # 配合 500 tick/轮：孤立湿铜平均约 8.3 分钟氧化一阶段，调大可更快）
  random-ticks-per-pass: 1
  # 未上蜡的铜傀儡在水中，平均每多少秒被随机刻选中一次（选中即氧化一阶段；默认 600 秒 = 平均约 10 分钟氧化一阶段）
  golem-random-tick-interval-seconds: 600
  # 全量纠偏/补建扫描间隔（分钟；扫描已加载区块，补全未被放置/水流事件捕获的水中铜方块；0=关闭）
  rescan-interval-minutes: 10
  # 全量扫描每游戏刻处理的区块数（仅影响启动补建/纠偏扫描的速度，过大可能造成短暂卡顿）
  scan-chunks-per-tick: 1
