    - DOLPHIN #海豚
    - FOX #狐狸
    - LLAMA #羊驼
    - NAUTILUS #鹦鹉螺
    - POLAR_BEAR #北极熊
    - WOLF #狼
    - ZOMBIE_NAUTILUS #僵尸鹦鹉螺
    - BLAZE #烈焰人
    - BOGGED #沼骸
    - BREEZE #旋风人
    - CREEPER #苦力怕
    - ELDER_GUARDIAN #远古守卫者
    - GHAST #恶魂
    - GUARDIAN #守卫者
    - HOGLIN #疣猪兽
    - HUSK #尸壳
    - MAGMA_CUBE #岩浆怪
    - PARCHED #焦骸
    - PILLAGER #掠夺者
    - SHULKER #潜影贝
    - SKELETON #骷髅
    - SLIME #史莱姆
    - STRAY #流浪者
    - VEX #恼鬼
    - WITCH #女巫
    - WITHER_SKELETON #凋灵骷髅
    - ZOGLIN #僵尸疣猪兽
