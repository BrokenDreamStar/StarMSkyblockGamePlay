name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew build

      # 读取 gradle.properties 中的版本号，作为 Release 的 tag
      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # 若该版本已发布过则跳过，避免重复 Release
      - name: Check release existence
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 从 CHANGELOG.md 提取当前版本的更新日志，写入 release_body.md
      - name: Extract changelog for version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$VERSION" <<'EOF'
          import sys
          version = sys.argv[1]
          lines = open('CHANGELOG.md', encoding='utf-8').read().splitlines()
          start = None
          end = len(lines)
          for i, line in enumerate(lines):
              if line.startswith('## [') and f'## [{version}]' in line:
                  start = i
              elif start is not None and line.startswith('## ['):
                  end = i
                  break
          if start is None:
              print(f"::error::CHANGELOG.md 中未找到版本 {version} 的条目")
              sys.exit(1)
          body = '# StarMSkyblockGamePlay v' + version + '\n\n' + '\n'.join(lines[start:end]).strip() + '\n'
          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)
          EOF

      - name: Publish Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: StarMSkyblockGamePlay v${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: build/libs/StarMSkyblockGamePlay-*.jar
          fail_on_unmatched_files: true
